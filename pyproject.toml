[project]
name = "claude-sessiond"
version = "0.1.0"
description = "HTTP daemon that hosts Claude Code sessions through the Claude Agent SDK"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "claude-agent-sdk>=0.2.188",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
claude-sessiond = "claude_sessiond:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["claude_sessiond.py"]
